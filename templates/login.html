{% extends "base.html" %}
{% block title %}Log in – SomaliScribe AI{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="card-dark rounded-2xl p-8">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-3 rounded-xl btn-accent flex items-center justify-center">
                <i class="fas fa-language text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome back</h1>
            <p class="text-gray-500 text-sm mt-1">Sign in to SomaliScribe AI</p>
        </div>
        <form method="post" action="{{ url_for('auth.login') }}">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2.5 bg-dark-900 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                       placeholder="you@example.com" value="{{ request.form.get('email', '') }}">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2.5 bg-dark-900 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                       placeholder="Enter password">
            </div>
            <div class="mb-5">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 rounded bg-dark-900 border-gray-600 text-accent focus:ring-accent">
                    <span class="text-sm text-gray-400">Remember me</span>
                </label>
            </div>
            <button type="submit" class="w-full btn-accent text-white py-2.5 rounded-xl font-semibold transition glow-purple">Log in</button>
        </form>

        <div class="my-5 flex items-center gap-3">
            <hr class="flex-1 border-white/10"><span class="text-xs text-gray-600">or</span><hr class="flex-1 border-white/10">
        </div>

        <a href="{{ url_for('create') }}" class="w-full inline-flex items-center justify-center bg-dark-500/50 border border-white/10 text-gray-300 py-2.5 rounded-xl hover:bg-dark-500 transition font-medium">
            <i class="fas fa-user-secret mr-2 text-gray-500"></i>Continue as Guest
        </a>

        <p class="mt-5 text-center text-sm text-gray-500">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-accent-light hover:underline">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
