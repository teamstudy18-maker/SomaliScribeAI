{% extends "base.html" %}
{% block title %}Admin Dashboard – SomaliScribe AI{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-white mb-6"><i class="fas fa-shield-halved mr-2 text-accent-light"></i>Admin Dashboard</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="card-dark rounded-xl p-5">
            <p class="text-gray-500 text-sm">Total Videos</p>
            <p class="text-3xl font-bold text-white mt-1">{{ total_jobs }}</p>
        </div>
        <div class="card-dark rounded-xl p-5">
            <p class="text-gray-500 text-sm">Successful</p>
            <p class="text-3xl font-bold text-green-400 mt-1">{{ done_jobs }}</p>
        </div>
        <div class="card-dark rounded-xl p-5">
            <p class="text-gray-500 text-sm">Failed</p>
            <p class="text-3xl font-bold text-red-400 mt-1">{{ failed_jobs }}</p>
        </div>
        <div class="card-dark rounded-xl p-5">
            <p class="text-gray-500 text-sm">Users</p>
            <p class="text-3xl font-bold text-accent-light mt-1">{{ total_users }}</p>
        </div>
    </div>
    <div class="flex flex-wrap gap-3">
        <a href="{{ url_for('admin.users') }}" class="bg-dark-600 border border-white/10 text-gray-300 px-5 py-2.5 rounded-xl hover:text-white transition"><i class="fas fa-users mr-2"></i>Manage Users</a>
        <a href="{{ url_for('admin.files') }}" class="bg-dark-600 border border-white/10 text-gray-300 px-5 py-2.5 rounded-xl hover:text-white transition"><i class="fas fa-folder mr-2"></i>Manage Files</a>
        <a href="{{ url_for('admin.stats') }}" class="bg-dark-600 border border-white/10 text-gray-300 px-5 py-2.5 rounded-xl hover:text-white transition"><i class="fas fa-chart-bar mr-2"></i>Statistics</a>
    </div>
</div>
{% endblock %}
