{% extends "base.html" %}
{% block title %}Register – SomaliScribe AI{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="card-dark rounded-2xl p-8">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-3 rounded-xl btn-accent flex items-center justify-center">
                <i class="fas fa-user-plus text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Create your account</h1>
            <p class="text-gray-500 text-sm mt-1">Get started with SomaliScribe AI</p>
        </div>
        <form method="post" action="{{ url_for('auth.register') }}">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2.5 bg-dark-900 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                       placeholder="you@example.com" value="{{ request.form.get('email', '') }}">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                       class="w-full px-4 py-2.5 bg-dark-900 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                       placeholder="Min 6 characters">
            </div>
            <div class="mb-5">
                <label for="confirm_password" class="block text-sm font-medium text-gray-400 mb-1">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                       class="w-full px-4 py-2.5 bg-dark-900 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                       placeholder="Repeat password">
            </div>
            <button type="submit" class="w-full btn-accent text-white py-2.5 rounded-xl font-semibold transition glow-purple">Create account</button>
        </form>
        <p class="mt-5 text-center text-sm text-gray-500">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-accent-light hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
